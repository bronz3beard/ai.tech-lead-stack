version: 2
updates:
  # pnpm workspace (root + apps/* + packages/*), resolved from pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # ai and @ai-sdk/* must move together: each provider major only works
      # with the matching ai major, and @ai-sdk/react pins ai exactly. Listed
      # first because Dependabot assigns a dependency to the first match.
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

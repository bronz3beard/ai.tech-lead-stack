version: 2
updates:
  # pnpm workspace (root + apps/* + packages/*), resolved from pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # ai and @ai-sdk/* must move together: each provider major only works
      # with the matching ai major, and @ai-sdk/react pins ai exactly. Listed
      # first because Dependabot assigns a dependency to the first match.
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 breaks lint:next: eslint-config-next's plugins (react,
      # jsx-a11y, import) only support ESLint <= 9 as of 2026-10-05. Remove this
      # once their peer ranges include ^10, then take the major in one PR.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

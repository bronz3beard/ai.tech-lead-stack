name: Reflexion Issue Runner

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to run against'
        required: true
        type: number

concurrency:
  group: reflexion-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  run-reflexion:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'reflexion:run') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && startsWith(github.event.comment.body, '/reflexion')) ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] || [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "Missing required API keys in secrets."
            ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number }}"
            if [ -n "$ISSUE_NUM" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM/comments \
                -d '{"body":"### 🚨 Reflexion Loop Error\nMissing required `GEMINI_API_KEY` or `ANTHROPIC_API_KEY` in repository secrets."}'
            fi
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Prisma
        run: pnpm prisma generate

      - name: Run Reflexion Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFLEXION_MAX_COST_USD: ${{ vars.REFLEXION_MAX_COST_USD || '3' }}
          REFLEXION_MAX_REVISIONS: ${{ vars.REFLEXION_MAX_REVISIONS || '3' }}
          # Pin the reflexion output directory to an absolute, repo-root path so the
          # loop and the upload step cannot disagree about where artifacts live.
          # scripts/reflexion-issue-runner.js / reflexion-loop.ts MUST honour this
          # env var when choosing where to write .reflexion-out (fix in that script
          # if it currently hardcodes a relative or script-relative path).
          REFLEXION_OUT_DIR: ${{ github.workspace }}/.reflexion-out
        run: node scripts/reflexion-issue-runner.js

      - name: Debug — list reflexion output
        if: always()
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "PWD             = $(pwd)"
          echo "--- expected out dir: $GITHUB_WORKSPACE/.reflexion-out ---"
          ls -la "$GITHUB_WORKSPACE/.reflexion-out" 2>/dev/null || echo "(nothing at \$GITHUB_WORKSPACE/.reflexion-out)"
          echo "--- any .reflexion-out anywhere in the workspace: ---"
          find "$GITHUB_WORKSPACE" -type d -name ".reflexion-out" 2>/dev/null || echo "(none found)"
          echo "--- files inside any found .reflexion-out dirs: ---"
          find "$GITHUB_WORKSPACE" -type f -path "*/.reflexion-out/*" 2>/dev/null || echo "(no files found)"

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflexion-state-${{ github.event.issue.number || github.event.inputs.issue_number }}
          # Absolute, repo-root path (matches REFLEXION_OUT_DIR) so the glob cannot
          # miss the files due to a working-directory mismatch. include-hidden-files
          # is required because the directory name begins with a dot.
          path: ${{ github.workspace }}/.reflexion-out/**
          include-hidden-files: true
          retention-days: 14
          # Fail loudly if the artifact is missing instead of silently passing.
          # A missing artifact means every resume will fail, so surface it here.
          if-no-files-found: error

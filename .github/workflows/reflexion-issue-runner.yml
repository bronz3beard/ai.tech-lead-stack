name: Reflexion Issue Runner

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to run against'
        required: true
        type: number

concurrency:
  group: reflexion-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  run-reflexion:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'reflexion:run') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && startsWith(github.event.comment.body, '/reflexion')) ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Check Authorization
        id: check_auth
        run: |
          AUTHORIZED_ACTORS="${{ vars.REFLEXION_AUTHORIZED_ACTORS || 'bronz3beard' }}"
          ACTOR="${{ github.actor }}"
          EVENT_NAME="${{ github.event_name }}"
          COMMENT_ASSOC="${{ github.event.comment.author_association }}"
          ISSUE_ASSOC="${{ github.event.issue.author_association }}"

          # Check if actor is in the authorized list
          # Using comma/space delimited checking
          IS_AUTHORIZED=false
          for authorized in $(echo "$AUTHORIZED_ACTORS" | tr ',' ' '); do
            if [ "$authorized" = "$ACTOR" ]; then
              IS_AUTHORIZED=true
              break
            fi
          done

          # Check associations based on event type to avoid bypassing logic
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$COMMENT_ASSOC" = "OWNER" ] || [ "$COMMENT_ASSOC" = "MEMBER" ] || [ "$COMMENT_ASSOC" = "COLLABORATOR" ]; then
              IS_AUTHORIZED=true
            fi
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ISSUE_ASSOC" = "OWNER" ] || [ "$ISSUE_ASSOC" = "MEMBER" ] || [ "$ISSUE_ASSOC" = "COLLABORATOR" ]; then
              IS_AUTHORIZED=true
            fi
          fi

          if [ "$IS_AUTHORIZED" = "false" ]; then
            echo "Actor $ACTOR is not authorized to trigger this workflow."
            ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number }}"
            if [ -n "$ISSUE_NUM" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM/comments \
                -d '{"body":"### 🚨 Reflexion Loop Error\nOnly the repository owner or authorized users may trigger the reflexion loop. Unauthorized attempt by `@'"$ACTOR"'` rejected."}'
            fi
            exit 1
          fi

      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] || [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "Missing required API keys in secrets."
            ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number }}"
            if [ -n "$ISSUE_NUM" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM/comments \
                -d '{"body":"### 🚨 Reflexion Loop Error\nMissing required `GEMINI_API_KEY` or `ANTHROPIC_API_KEY` in repository secrets."}'
            fi
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Prisma
        run: pnpm prisma generate

      - name: Run Reflexion Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFLEXION_MAX_COST_USD: ${{ vars.REFLEXION_MAX_COST_USD || '3' }}
          REFLEXION_MAX_REVISIONS: ${{ vars.REFLEXION_MAX_REVISIONS || '3' }}
        run: node scripts/reflexion-issue-runner.js

      # TEMPORARY debug step — remove once the artifact upload is confirmed working.
      # The runner writes to $GITHUB_WORKSPACE/.reflexion-out (see OUT_DIR in
      # scripts/reflexion-issue-runner.js). This proves the files exist there.
      - name: Debug — list reflexion output
        if: always()
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/.reflexion-out" 2>/dev/null || echo "(nothing at .reflexion-out)"

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflexion-state-${{ github.event.issue.number || github.event.inputs.issue_number }}
          # Matches OUT_DIR = $GITHUB_WORKSPACE/.reflexion-out in the runner.
          path: ${{ github.workspace }}/.reflexion-out/**
          # THE FIX: .reflexion-out is a hidden (dot) directory; upload-artifact@v4
          # excludes hidden files by default, which is why prior runs reported
          # "No files were found" even though the loop wrote plan.md/critique.json/
          # interview.md there. This line makes them upload.
          include-hidden-files: true
          retention-days: 14
          # Fail loudly if the artifact is missing, instead of silently passing and
          # only surfacing the problem later when a resume can't find it.
          if-no-files-found: error
